name: PHP Quality

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpstan.neon"
      - "phpcs.xml.dist"
      - ".gitattributes"
      - "scripts/verify/**"
      - "scripts/verify-composer-dist.sh"
      - ".github/workflows/php-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpstan.neon"
      - "phpcs.xml.dist"
      - ".gitattributes"
      - "scripts/verify/**"
      - "scripts/verify-composer-dist.sh"
      - ".github/workflows/php-quality.yml"

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Assert PHP requirement (WordPress-aligned minimum)
        run: |
          php -r '$j=json_decode(file_get_contents("composer.json"),true); $c=$j["require"]["php"]??""; if(!preg_match("/^\^(\d+)\.(\d+)(?:\.(\d+))?/",$c,$m)){fwrite(STDERR,"require.php: invalid or missing caret constraint\n"); exit(1);} $min=sprintf("%d.%d.%d",(int)$m[1],(int)$m[2],isset($m[3])?(int)$m[3]:0); if(version_compare($min,"8.3.0","<")){fwrite(STDERR,"require.php minimum must be >= 8.3.0, got {$c}\n"); exit(1);}'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP quality (local script = CI)
        run: bash scripts/verify/all.sh
